<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Calendario del Eterno · Yeshúa La Torá Viviente</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1a30">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cal. Eterno">
<style>
:root{
  --navy:#0b1a30;
  --navy-2:#132542;
  --gold:#bfa15f;
  --gold-light:#e9dfc8;
  --ivory:#faf8f5;
  --texto:#2b2b2b;
  --rojo:#7a1f1f;
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--ivory);color:var(--texto);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;}
#app{max-width:720px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom,0);}

header.top{background:var(--navy);color:var(--ivory);padding:14px 16px calc(14px + env(safe-area-inset-top,0));
  padding-top:calc(14px + env(safe-area-inset-top,0));display:flex;align-items:center;gap:12px;
  position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.25);}
header.top img{height:34px;display:block;}
header.top .titulos{flex:1;min-width:0;}
header.top h1{margin:0;font-size:15px;font-weight:700;color:var(--gold);letter-spacing:.3px;}
header.top p{margin:0;font-size:11px;color:#cfd6e2;}

nav.tabs{display:flex;background:var(--navy-2);position:sticky;top:62px;z-index:19;
  overflow-x:auto;-webkit-overflow-scrolling:touch;}
nav.tabs button{flex:1;min-width:82px;background:transparent;border:0;color:#b9c2d4;
  padding:11px 6px;font-size:12.5px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;
  white-space:nowrap;}
nav.tabs button.activo{color:var(--gold);border-bottom-color:var(--gold);}

main{flex:1;padding:14px 12px 90px 12px;}

.card{background:#fff;border:1px solid var(--gold-light);border-radius:var(--radius);
  padding:14px;margin-bottom:14px;box-shadow:0 1px 4px rgba(11,26,48,.06);}

.selector-anio{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px;}
.selector-anio select{font-size:14px;padding:8px 10px;border-radius:10px;border:1.5px solid var(--gold);
  background:var(--gold-light);color:var(--navy);font-weight:700;}

.nav-mes{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;}
.nav-mes button{background:var(--navy);color:var(--gold);border:0;border-radius:10px;
  width:42px;height:42px;font-size:20px;cursor:pointer;flex-shrink:0;}
.nav-mes .titulo-mes{flex:1;text-align:center;}
.nav-mes .titulo-mes h2{margin:0;font-size:18px;color:var(--navy);}
.nav-mes .titulo-mes span{font-size:11.5px;color:var(--gold);font-weight:600;}

.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.grid7 .cab{font-size:9.5px;font-weight:700;text-align:center;color:var(--ivory);
  background:var(--navy);padding:6px 0;border-radius:6px 6px 0 0;}
.dia{background:#fff;border:1px solid #eee2c8;border-radius:6px;min-height:58px;
  padding:3px 3px;font-size:9.5px;position:relative;}
.dia.shabat{background:var(--gold-light);}
.dia.vacio{background:transparent;border:none;}
.dia .num{font-weight:800;font-size:12px;color:var(--navy);}
.dia .greg{color:#7a7a7a;font-size:8px;display:block;}
.dia .heb{color:#8a7238;font-size:7.6px;display:block;}
.dia .evt{color:var(--rojo);font-size:7.4px;font-weight:700;display:block;margin-top:1px;line-height:1.05;}
.dia.festivo{outline:2px solid var(--rojo);}

.lista-eventos{margin-top:4px;}
.evento-row{display:flex;gap:10px;padding:9px 4px;border-bottom:1px solid #f0e8d6;align-items:flex-start;}
.evento-row:last-child{border-bottom:none;}
.evento-row .fecha{flex-shrink:0;width:52px;text-align:center;background:var(--navy);color:var(--gold);
  border-radius:8px;padding:6px 2px;font-size:10.5px;font-weight:800;}
.evento-row .detalle{flex:1;}
.evento-row .detalle .nombre{font-weight:700;color:var(--navy);font-size:13px;}
.evento-row .detalle .sub{font-size:11px;color:#777;margin-top:2px;}

h3.titulo-seccion{color:var(--navy);font-size:16px;margin:2px 0 10px 0;border-left:4px solid var(--gold);
  padding-left:8px;}
p.texto{font-size:13.3px;line-height:1.55;text-align:justify;color:var(--texto);}
.advertencia-box{background:#fdf6f0;border:1.5px solid var(--rojo);border-radius:10px;padding:12px;}
.advertencia-box h4{margin:0 0 6px 0;color:var(--rojo);font-size:13.5px;}
.advertencia-box p{font-size:12.5px;line-height:1.5;font-style:italic;color:#4a2020;margin:0;text-align:justify;}

.tabla-estaciones{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:10px;}
.tabla-estaciones th{background:var(--navy);color:var(--ivory);padding:7px;text-align:left;}
.tabla-estaciones td{padding:7px;border-bottom:1px solid #f0e8d6;}
.tabla-estaciones tr:nth-child(even) td{background:var(--gold-light);}

ul.fuentes{padding-left:18px;font-size:12.5px;line-height:1.7;color:var(--texto);}

footer.pie{position:fixed;left:0;right:0;bottom:0;background:var(--navy);padding:8px 14px calc(8px + env(safe-area-inset-bottom,0));
  display:flex;align-items:center;justify-content:space-between;z-index:20;max-width:720px;margin:0 auto;}
footer.pie img{height:20px;}
footer.pie button{background:var(--gold);color:var(--navy);border:0;border-radius:20px;
  padding:9px 16px;font-weight:800;font-size:12.5px;cursor:pointer;}
footer.pie button:active{opacity:.8;}

.badge-estacion{display:inline-block;background:var(--gold);color:var(--navy);font-weight:800;
  font-size:10.5px;padding:2px 9px;border-radius:12px;margin-left:6px;}

.instalar-box{background:var(--gold-light);border-radius:10px;padding:11px;font-size:12px;line-height:1.5;margin-top:10px;}
.instalar-box b{color:var(--navy);}

.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--navy);
  color:var(--gold);padding:10px 18px;border-radius:20px;font-size:12.5px;z-index:50;box-shadow:0 4px 14px rgba(0,0,0,.3);}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <img id="logoHeader" alt="logo">
    <div class="titulos">
      <h1>CALENDARIO DEL ETERNO</h1>
      <p>364 días · Yeshúa — La Torá Viviente</p>
    </div>
  </header>

  <nav class="tabs">
    <button data-tab="mes" class="activo">Mes</button>
    <button data-tab="resumen">Resumen del año</button>
    <button data-tab="advertencia">Advertencia</button>
    <button data-tab="fuentes">Fuentes</button>
  </nav>

  <main id="main"></main>

  <footer class="pie">
    <img id="logoFooter" alt="logo">
    <button id="btnPDF">Descargar PDF</button>
  </footer>
</div>
